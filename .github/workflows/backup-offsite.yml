name: Backup offsite

# VPS не достучится до api.telegram.org — забираем дамп по SSH и
# кладём копию вне сервера: GitHub Artifact + Telegram с раннера.

on:
  schedule:
    # после локального cron 03:15 UTC
    - cron: '30 3 * * *'
  workflow_dispatch:

concurrency:
  group: backup-offsite
  cancel-in-progress: false

jobs:
  offsite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Setup SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          DEPLOY_USER="${DEPLOY_USER:-root}"
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          : "${DEPLOY_HOST:?}"
          : "${DEPLOY_SSH_KEY:?}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          {
            echo "Host impuls"
            echo "  HostName ${DEPLOY_HOST}"
            echo "  User ${DEPLOY_USER}"
            echo "  Port ${DEPLOY_PORT}"
            echo "  IdentityFile ~/.ssh/id_ed25519"
            echo "  IdentitiesOnly yes"
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Fetch latest Postgres dump
        id: fetch
        run: |
          set -euo pipefail
          mkdir -p backups
          remote=$(ssh impuls 'ls -1t /opt/impuls-data/backups/postgres/impuls-*.sql.gz | head -n1')
          : "${remote:?no backup on server}"
          name=$(basename "$remote")
          scp "impuls:${remote}" "backups/${name}"
          echo "file=${name}" >> "$GITHUB_OUTPUT"
          ls -lh "backups/${name}"

      - name: Upload GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: postgres-backup-${{ steps.fetch.outputs.file }}
          path: backups/${{ steps.fetch.outputs.file }}
          retention-days: 30
          if-no-files-found: error

      - name: Send to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FILE: ${{ steps.fetch.outputs.file }}
        run: |
          set -euo pipefail
          if [[ -z "${TELEGRAM_BOT_TOKEN:-}" || -z "${TELEGRAM_CHAT_ID:-}" ]]; then
            echo "Telegram secrets missing — artifact already saved"
            exit 0
          fi
          size=$(wc -c < "backups/${FILE}" | tr -d ' ')
          curl -4 -sS --connect-timeout 20 --max-time 120 \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            -F "caption=🗄 Impuls Postgres offsite
${FILE}
size=${size}B
via GitHub Actions" \
            -F "document=@backups/${FILE};filename=${FILE}" \
            | tee /tmp/tg.json \
            | python3 -c 'import sys,json; d=json.load(sys.stdin); assert d.get("ok"), d; print("telegram ok")'
