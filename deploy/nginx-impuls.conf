# Nginx: витрина + API + админка на одном сервере
# ---------------------------------------------------------------------------
# Процессы:
#   Nest API  → 127.0.0.1:3001
#   Nuxt site → 127.0.0.1:3000
# Админка:    /var/www/admin.impuls.esmolakov.ru
#
# sudo cp deploy/nginx-impuls.conf /etc/nginx/sites-available/impuls
# sudo ln -sf /etc/nginx/sites-available/impuls /etc/nginx/sites-enabled/
# sudo nginx -t && sudo systemctl reload nginx
# HTTPS: certbot --nginx -d impuls.esmolakov.ru -d admin.impuls.esmolakov.ru

upstream impuls_nuxt {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream impuls_api {
    server 127.0.0.1:3001;
    keepalive 32;
}

# --- Витрина ---
server {
    listen 80;
    listen [::]:80;
    server_name impuls.esmolakov.ru;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml image/webp;
    gzip_min_length 256;

    client_max_body_size 25m;

    location /uploads/ {
        proxy_pass http://impuls_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://impuls_nuxt;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

# --- Админка ---
server {
    listen 80;
    listen [::]:80;
    server_name admin.impuls.esmolakov.ru;

    root /var/www/admin.impuls.esmolakov.ru;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://impuls_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://impuls_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
